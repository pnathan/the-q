name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: cargo build (all features)
        run: cargo build --all-targets --all-features
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: cargo fmt --check
        run: cargo fmt --check
      - name: cargo test (all features)
        run: cargo test --all-features
      - name: no-LGPL-3.0-in-release-tree check
        run: ./scripts/check-no-lgpl3-release-deps.sh

  # Verus verification (spec §6, obligations V1-V8). This job was authored
  # and iterated on entirely via CI feedback -- the environment that wrote
  # it has no local Verus toolchain access (see TRUSTED.md), so if the
  # version pin below goes stale or the invocation needs adjusting, expect
  # to fix it the same way: push, read the Actions log, adjust.
  verus:
    runs-on: ubuntu-24.04 # matches verus-lang's published prebuilt-artifact target
    env:
      VERUS_VERSION: 0.2026.07.18.3a4d30b
    steps:
      - uses: actions/checkout@v4
      - name: Download verus
        run: |
          curl -sSL -o verus.zip \
            "https://github.com/verus-lang/verus/releases/download/release/${VERUS_VERSION}/verus-${VERUS_VERSION}-x86-linux.zip"
          unzip -q verus.zip
          mv verus-x86-linux verus-install
          chmod +x verus-install/verus
      - name: Install the rust toolchain verus requires
        # Parsed from verus's own error output rather than hardcoded, so a
        # future VERUS_VERSION bump doesn't silently drift out of sync with
        # whatever toolchain that release actually needs.
        run: |
          set +e
          out=$(./verus-install/verus --version 2>&1)
          set -e
          if echo "$out" | grep -q "required rust toolchain"; then
            toolchain=$(echo "$out" | grep -oP "required rust toolchain \K\S+")
            echo "Installing required toolchain: $toolchain"
            rustup install "$toolchain"
          else
            echo "$out"
          fi
      - name: verus --version (sanity check)
        run: ./verus-install/verus --version
      - name: verus verify all proof files
        # Every file under verus/ is an independent standalone Verus
        # program (see verus/smoke_test.rs's header comment for why these
        # live outside the cargo package). Verify each one.
        run: |
          status=0
          for f in verus/*.rs; do
            echo "::group::verus $f"
            # Default SMT rlimit (~10s per query) isn't enough for some of
            # the degree-3 polynomial identities in algebra.rs; give every
            # file more headroom rather than special-casing one.
            if ! ./verus-install/verus --rlimit 60 "$f"; then
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status

  # Verus verification of the *shipped* code (TRUSTED.md "concrete next
  # steps" #1, now done): vstd is a real (non-optional) dependency and
  # verus!{} blocks live inline in src/rounding.rs (canonicalize_i128,
  # gcd_u128, ...), rather than only in the standalone verus/ mirrors above.
  # Hard-gated, not continue-on-error -- proven out locally (36 verified, 0
  # errors) before being promoted here.
  verus-real-code:
    runs-on: ubuntu-24.04 # matches verus-lang's published prebuilt-artifact target
    env:
      VERUS_VERSION: 0.2026.07.18.3a4d30b
    steps:
      - uses: actions/checkout@v4
      - name: Download verus
        run: |
          curl -sSL -o verus.zip \
            "https://github.com/verus-lang/verus/releases/download/release/${VERUS_VERSION}/verus-${VERUS_VERSION}-x86-linux.zip"
          unzip -q verus.zip
          mv verus-x86-linux verus-install
          chmod +x verus-install/verus
      - name: Install the rust toolchain verus requires
        run: |
          set +e
          out=$(./verus-install/verus --version 2>&1)
          set -e
          if echo "$out" | grep -q "required rust toolchain"; then
            toolchain=$(echo "$out" | grep -oP "required rust toolchain \K\S+")
            echo "Installing required toolchain: $toolchain"
            rustup install "$toolchain"
          else
            echo "$out"
          fi
      - name: verus verify src/lib.rs (real shipped code, not a mirror)
        run: ./verus-install/verus --rlimit 60 src/lib.rs --crate-type=lib
