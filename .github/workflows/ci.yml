name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # Enforced gate: plain rustc build + full test suite + license hygiene.
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (all features)
        run: cargo clippy --all-features --all-targets -- -D warnings
      - name: Build (plain rustc, no_std)
        run: cargo build --verbose
      - name: Build (no default features)
        run: cargo build --no-default-features --verbose
      - name: Test (all features, overflow checks on)
        run: cargo test --all-features --verbose
      - name: License hygiene — no LGPL in release tree
        run: bash ci/check_no_lgpl.sh

  # Runs the Verus proofs. The GitHub Actions runner (unlike the authoring
  # sandbox) can reach github.com, so the toolchain is installed from the latest
  # Verus release, resolved dynamically via the GitHub API — no guessed URL.
  # verify.sh hard-gates the admit-free target (verus/src/gcd_checked.rs) and
  # reports the broader scaffold non-fatally.
  verus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Verus (release pinned to match the vstd crate version)
        env:
          # api.github.com is rate-limited unauthenticated; the job token lifts it.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional override, e.g. VERUS_TAG=release/0.2026.07.27.<hash>
          VERUS_TAG: ${{ vars.VERUS_TAG }}
          # Must match the vstd/verus_builtin version pinned in Cargo.toml so that
          # the binary's bundled vstd and the crates.io vstd share one API.
          VERUS_DATE: "0.2026.07.27"
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/verus-lang/verus/releases"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28")
          if [ -n "${VERUS_TAG:-}" ]; then
            rel="$api/tags/${VERUS_TAG}"
          else
            # Find the release whose tag carries the target date (matches Cargo's vstd).
            tag="$(curl -fsSL "${auth[@]}" "$api?per_page=100" \
                   | jq -r '.[].tag_name' | grep -F "$VERUS_DATE" | head -1)"
            if [ -z "$tag" ]; then
              echo "::error::no Verus release tag matching $VERUS_DATE"; exit 1
            fi
            rel="$api/tags/$tag"
          fi
          echo "Resolving Verus release: $rel"
          # Pick the x86-64 Linux zip asset regardless of the exact name shape.
          url="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
                       -H "X-GitHub-Api-Version: 2022-11-28" "$rel" \
                 | jq -r '.assets[].browser_download_url
                          | select(test("(x86[-_]?64|x86).*(linux)|(linux).*(x86[-_]?64|x86)"; "i"))
                          | select(endswith(".zip"))' | head -1)"
          if [ -z "$url" ] || [ "$url" = "null" ]; then
            echo "::error::Could not resolve a Linux x86-64 Verus asset from $rel"
            exit 1
          fi
          echo "Downloading $url"
          curl -fsSL -o verus.zip "$url"
          unzip -q verus.zip -d "$HOME/verus"
          bin="$(find "$HOME/verus" -type f -name verus | head -1)"
          if [ -z "$bin" ]; then
            echo "::error::verus binary not found in the extracted archive"
            find "$HOME/verus" -maxdepth 2 -type f | head -50
            exit 1
          fi
          bindir="$(dirname "$bin")"
          echo "$bindir" >> "$GITHUB_PATH"
          echo "Verus at: $bin"
          # Verus runs against the exact Rust toolchain it was built with. Ask
          # the binary which one it needs (it prints this even when the toolchain
          # is missing) and install that via rustup — self-adapting to whatever
          # release was resolved above.
          need="$("$bin" --version 2>&1 \
                  | grep -oE '[0-9]+\.[0-9]+\.[0-9]+-x86_64-unknown-linux-gnu' | head -1 || true)"
          if [ -n "$need" ]; then
            echo "Verus requires rust toolchain: $need"
            rustup toolchain install "$need" --profile minimal --no-self-update
          else
            echo "Could not detect a pinned toolchain from verus --version; proceeding."
            "$bin" --version || true
          fi
      - name: Verify (Verus) + trusted-boundary discipline
        run: bash ci/verify.sh
