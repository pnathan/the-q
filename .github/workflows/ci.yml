name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # Enforced gate: plain rustc build + full test suite + license hygiene.
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (all features)
        run: cargo clippy --all-features --all-targets -- -D warnings
      - name: Build (plain rustc, no_std)
        run: cargo build --verbose
      - name: Build (no default features)
        run: cargo build --no-default-features --verbose
      - name: Test (all features, overflow checks on)
        run: cargo test --all-features --verbose
      - name: License hygiene — no LGPL in release tree
        run: bash ci/check_no_lgpl.sh

  # Progress job: runs the Verus proofs. Non-blocking until every obligation in
  # verus/README.md is promoted to "complete" (then drop continue-on-error).
  verus:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Verus (best-effort; never fails the job)
        run: |
          # The Verus release asset name/version is intentionally not hard-pinned
          # to a URL this repo cannot verify. This step tries a couple of known
          # asset name shapes; if none is fetchable it cleanly skips, and the
          # verify step below runs the toolchain-free discipline checks. When you
          # settle on a verified Verus release, pin it here and drop the
          # `continue-on-error` on this job.
          set +e
          VERUS_VERSION="${VERUS_VERSION:-release/0.2025.06.14}"
          base="https://github.com/verus-lang/verus/releases/download/${VERUS_VERSION}"
          for asset in "verus-x86-linux.zip" "verus-x86_64-linux.zip" "verus-linux-x86_64.zip"; do
            if curl -fsSL -o verus.zip "${base}/${asset}" && unzip -tq verus.zip >/dev/null 2>&1; then
              unzip -q verus.zip -d "$HOME/verus"
              bin="$(find "$HOME/verus" -type f -name verus | head -1)"
              if [ -n "$bin" ]; then
                echo "$(dirname "$bin")" >> "$GITHUB_PATH"
                echo "Verus provisioned from ${asset}."
              fi
              break
            fi
          done
          if ! command -v verus >/dev/null 2>&1 && [ ! -d "$HOME/verus" ]; then
            echo "Verus toolchain not provisioned; verify.sh will run discipline checks only."
          fi
          exit 0
      - name: Verify (Verus if present) + trusted-boundary discipline
        run: bash ci/verify.sh
