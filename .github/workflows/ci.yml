name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    name: cargo build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build (plain rustc, overflow-checks=on)
        run: cargo build --all-features
      - name: Run tests
        run: cargo test --all-features
      - name: Check no LGPL in release dependency tree
        run: |
          # malachite-q must NOT appear outside dev-dependencies
          cargo metadata --no-deps --format-version 1 \
            | python3 -c "
          import sys, json
          meta = json.load(sys.stdin)
          pkgs = {p['name'] for p in meta.get('packages', [])}
          bad = [n for n in pkgs if 'malachite' in n.lower()]
          if bad:
              print('ERROR: LGPL malachite crate in non-dev tree:', bad)
              sys.exit(1)
          print('OK: no malachite in release tree')
          "

  # Verus verification job — runs when verus is available in the runner.
  # Set VERUS_PATH in repo secrets to enable; skipped otherwise.
  verus:
    name: verus verify
    runs-on: ubuntu-latest
    if: ${{ vars.VERUS_AVAILABLE == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (Verus-pinned nightly)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2024-11-10
      - name: Download Verus
        run: |
          curl -L "${{ secrets.VERUS_RELEASE_URL }}" -o verus.tar.gz
          tar xzf verus.tar.gz
          echo "$PWD/verus" >> $GITHUB_PATH
      - name: Verify
        run: verus src/lib.rs --crate-type=lib
