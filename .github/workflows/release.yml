name: Release

# Trusted Publishing: crates.io exchanges a short-lived OIDC token minted by
# this workflow for a scoped, single-use publish token. No long-lived
# CARGO_REGISTRY_TOKEN secret exists in this repository. The crates.io side of
# the trust relationship (owner, this repo, this workflow file, this
# environment) is configured once at https://crates.io/crates/the-q/settings
# and is not itself expressed in this file.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  verify:
    name: Tag matches Cargo.toml version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: check
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "the-q") | .version')
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag v$tag does not match Cargo.toml version $manifest"
            exit 1
          fi
          echo "version=$manifest" >> "$GITHUB_OUTPUT"

  # Re-run of the build-and-test job in ci.yml. A tag can point at a commit
  # `ci.yml` never ran on -- for example one pushed straight to a protected
  # branch by an admin -- so publication does not trust a possibly-stale
  # status check; it re-establishes green here.
  test:
    name: cargo build + test
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
      - run: cargo build --locked --all-features --verbose
      - run: cargo build --locked --release --all-features --verbose
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo fmt --check
      - run: cargo test --locked --all-features --verbose
      - run: cargo test --locked --release --all-features --verbose
      - run: ./scripts/check-rat-privacy.sh
      - run: ./scripts/check-no-lgpl.sh

  publish:
    name: cargo publish
    needs: [verify, test]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
      - name: Dry run (catches a bad `exclude`/manifest before it is irreversible)
        run: cargo publish --locked --dry-run
      - name: Mint a crates.io token via OIDC
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: cargo publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
