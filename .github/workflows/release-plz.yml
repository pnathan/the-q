name: Release-plz

# Keeps a standing PR (config: release-plz.toml) that bumps Cargo.toml's
# version and writes CHANGELOG.md from the Conventional Commits merged since
# the last release. It only opens and updates that PR. Publishing happens in
# release.yml, when the `vX.Y.Z` tag is pushed after the PR merges.
on:
  push:
    branches:
      - trunk

jobs:
  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
      - name: Run release-plz release-pr
        uses: release-plz/action@476794ede164c5137bfc3a1dc6ed3675275690f9 # v0.5.99
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
