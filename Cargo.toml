[package]
name = "the-q"
version = "0.1.0"
edition = "2021"
description = "Bounded, canonical, verified-rounding rational arithmetic (Q)"
license = "LGPL-2.1-only"
repository = "https://github.com/pnathan/the-q"
readme = "README.md"
keywords = ["rational", "arithmetic", "verus", "verified", "exact"]
categories = ["mathematics", "no-std"]

[lib]
name = "the_q"
path = "src/lib.rs"

[lints.rust]
# Set by the real `verus` tool (not plain cargo/rustc) when it compiles this
# crate for verification; src/rounding.rs gates vstd ghost-only imports on
# it so plain `cargo build` (which never sets it) still resolves cleanly.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(verus_keep_ghost)"] }

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }

# Verus checks the *shipped* code directly: verus!{} blocks live inline in
# src/ (canonicalize_i128, gcd_u128, ...), not as separate mirrors under
# verus/ (see TRUSTED.md). vstd/builtin_macros also compile under plain
# rustc -- confirmed locally (stable 1.94.1, no special toolchain needed for
# `cargo build`; the pinned 1.96.0 toolchain is only required to run the
# verus binary itself for verification, in CI's `verus` job) -- but ghost-
# only vstd items (proof fns like `lemma_fundamental_div_mod`) only exist
# under the `verus_keep_ghost` cfg the verus tool sets, so src/rounding.rs
# gates its import of those on `#[cfg(verus_keep_ghost)]`. Pinned to the
# same release tag CI's `verus` job downloads.
vstd = { git = "https://github.com/verus-lang/verus", tag = "release/0.2026.07.18.3a4d30b" }

[dev-dependencies]
# Oracle for differential testing ONLY. malachite-q is LGPL-3.0-only, which is
# why it was rejected as a runtime dependency (see README "Why not
# malachite-q"). It must never appear outside [dev-dependencies] -- enforced
# by `scripts/check-no-lgpl3-release-deps.sh` in CI.
malachite-q = "0.6"
malachite-base = "0.6"
proptest = "1"
serde_json = "1"

[features]
default = []
serde = ["dep:serde"]

# V2 requires every i128 intermediate to be provably in range; overflow-checks
# turns any place that claim is wrong into a hard panic instead of silent
# wraparound, in every profile (this crate has no formal proof backing V2 in
# this environment -- see TRUSTED.md -- so the runtime check is load-bearing).
[profile.dev]
overflow-checks = true

[profile.release]
overflow-checks = true
