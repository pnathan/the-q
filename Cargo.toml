[package]
name = "the-q"
version = "0.1.0"
edition = "2021"
description = "Exact-with-verified-rounding rational arithmetic (Q type)"
license = "LGPL-2.1-only"

[features]
default = []
serde = ["dep:serde"]

[package.metadata.verus]
verify = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus_keep)'] }

[dependencies]
vstd = "0.0.0-2026-07-12-0122"
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
malachite-q = "0.4"
malachite-base = "0.4"
proptest = "1"
rand = "0.8"
