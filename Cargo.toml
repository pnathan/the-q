[package]
name = "the-q"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Verified bounded rational (ℚ) arithmetic with directed rounding, checked by Verus."
license = "LGPL-2.1-only"
repository = "https://github.com/pnathan/the-q"
readme = "README.md"
keywords = ["rational", "arithmetic", "verified", "verus", "exact"]
categories = ["mathematics", "no-std::no-alloc"]

[features]
default = []
serde = ["dep:serde"]

[dependencies]
serde = { version = "1", optional = true, default-features = false, features = ["derive"] }
# Verus standard library + the `verus!` macro. These make `src/lib.rs` itself the
# verification target (rather than a standalone transcription): the same source
# both `cargo build`s (the macro expands to plain Rust) and is verified by
# `verus --crate-type=lib src/lib.rs`. Pinned to the release the CI `verus`
# binary is pinned to (see .github/workflows/ci.yml, VERUS_DATE).
vstd = "=0.0.0-2026-07-27-0206"
verus_builtin = "=0.0.0-2026-07-27-0206"
verus_builtin_macros = "=0.0.0-2026-07-27-0206"

[dev-dependencies]
# LGPL-3.0 oracle — dev-only, MUST NOT appear in the release dependency tree.
malachite-q = "0.4"
malachite-base = "0.4"
malachite-nz = "0.4"
serde_json = "1"

[profile.test]
overflow-checks = true

[profile.dev]
overflow-checks = true

[profile.release]
overflow-checks = true
