[package]
name = "the-q"
version = "0.1.0"
edition = "2021"
license = "LGPL-2.1"
description = "Verified bounded rational arithmetic (Verus): exact while values fit a 2^62 budget, machine-checked directed rounding when they don't"
repository = "https://github.com/pnathan/the-q"

[lib]
name = "the_q"
path = "src/lib.rs"

[dependencies]
# vstd version is pinned to the Verus release used for verification (see ci.yml: release/0.2026.07.12.0b42f4c).
vstd = { version = "=0.0.0-2026-07-12-0122", default-features = true }
serde = { version = "1", optional = true, default-features = false }

[features]
default = []
serde = ["dep:serde"]

[dev-dependencies]
# LGPL-3.0-only oracle: dev-dependency ONLY, must never enter the non-dev tree (CI enforces).
malachite-q = "0.9"
malachite-base = "0.9"
proptest = "1"
serde_json = "1"

[package.metadata.verus]
verify = true
