[package]
name = "the-q"
version = "0.1.0"
edition = "2021"
description = "Exact-with-verified-rounding rational arithmetic, checked by Verus"
license = "MIT"

[features]
default = []
serde = ["dep:serde"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
vstd = { version = "0.0.0-2026-07-12-0122", default-features = false }

[dev-dependencies]
malachite-q = "0.4"
malachite-base = "0.4"
rand = "0.8"
serde_json = "1"

[profile.dev]
overflow-checks = true

[profile.release]
overflow-checks = true
